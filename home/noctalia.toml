[bar.default]
background_opacity = 0.4999999888241291
capsule = true
center = [ "group:g1", "clock" ]
end = [ "tray", "group:g3" ]
margin_edge = 5
margin_ends = 5
padding = 5
position = "left"
radius = 7
start = [ "group:g2", "media", "taskbar" ]
thickness = 25

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bar", "workspaces" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "session", "control-center", "launcher", "notifications" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network", "bluetooth", "brightness", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0

[dock]
enabled = true
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen]
blur_intensity = 0.24999999441206455

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WL-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 878.0
    output = "WL-1"
    placement_height = 1060.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
temperature_day = 7300
temperature_night = 7200

[plugins]
enabled = [ "noctalia/umbriel-companion" ]

[shell]
polkit_agent = true

    [shell.launcher]
    app_grid = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Kanagawa Dragon"
pure_black_dark = true
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

[wallpaper.default]
path = "/home/cardetas/Pictures/Wallpapers/909769.png"

[wallpaper.last]
path = "/home/cardetas/Pictures/Wallpapers/909769.png"

[wallpaper.monitors.eDP-1]
path = "/home/cardetas/Pictures/Wallpapers/909769.png"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.bluetooth]
hide_when_adapter_off = true

[widget.brightness]
show_label = false

[widget.clock]
capsule = true
capsule_opacity = 0.0
scale = 1.1000000000000001

[widget.control-center]
custom_image = "/run/current-system/sw/share/icons/hicolor/scalable/apps/nix-snowflake-white.svg"
custom_image_colorize = true
glyph = "brand-arc"

[widget.network]
show_label = false

[widget.session]
enabled = false

[widget.tray]
drawer = true

[widget.volume]
custom_image_colorize = true
show_label = false
