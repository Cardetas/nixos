[bar.default]
background_opacity = 0.4999999888241291
capsule = true
center = [ "group:g1", "clock", "status" ]
end = [ "tray", "group:g3" ]
margin_edge = 5
margin_ends = 5
padding = 5
position = "left"
radius = 7
start = [ "group:g2", "media", "taskbar" ]
thickness = 25

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bar", "workspaces" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "session", "control-center", "launcher", "notifications" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network", "bluetooth", "brightness", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0

